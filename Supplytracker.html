<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --surface2: #232220;
    --border: #2e2c29;
    --accent: #e8c84a;
    --accent2: #e87a3a;
    --text: #f0ece3;
    --muted: #7a776e;
    --danger: #e85a5a;
    --success: #5ae89a;
  }

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: var(–bg);
color: var(–text);
font-family: ‘DM Sans’, sans-serif;
min-height: 100vh;
overflow-x: hidden;
}

/* Grid texture */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background-image:
linear-gradient(rgba(232,200,74,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(232,200,74,0.03) 1px, transparent 1px);
background-size: 40px 40px;
pointer-events: none;
z-index: 0;
}

.wrapper {
position: relative;
z-index: 1;
max-width: 1100px;
margin: 0 auto;
padding: 0 20px 60px;
}

/* HEADER */
header {
padding: 40px 0 30px;
display: flex;
align-items: flex-end;
justify-content: space-between;
gap: 20px;
border-bottom: 1px solid var(–border);
margin-bottom: 36px;
flex-wrap: wrap;
}

.header-left h1 {
font-family: ‘Bebas Neue’, sans-serif;
font-size: clamp(42px, 6vw, 72px);
letter-spacing: 3px;
line-height: 1;
color: var(–accent);
}

.header-left p {
font-family: ‘DM Mono’, monospace;
font-size: 11px;
color: var(–muted);
letter-spacing: 2px;
text-transform: uppercase;
margin-top: 6px;
}

.date-display {
text-align: right;
font-family: ‘DM Mono’, monospace;
font-size: 11px;
color: var(–muted);
letter-spacing: 1px;
line-height: 1.8;
}

.date-display span {
color: var(–accent);
font-weight: 500;
}

/* LAYOUT */
.main-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 20px;
margin-bottom: 28px;
}

@media (max-width: 680px) {
.main-grid { grid-template-columns: 1fr; }
}

/* CARD */
.card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 4px;
overflow: hidden;
}

.card-header {
padding: 16px 20px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: space-between;
gap: 10px;
}

.card-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 22px;
letter-spacing: 2px;
color: var(–text);
}

.tag {
font-family: ‘DM Mono’, monospace;
font-size: 9px;
letter-spacing: 2px;
text-transform: uppercase;
padding: 3px 8px;
border-radius: 2px;
background: rgba(232,200,74,0.1);
color: var(–accent);
border: 1px solid rgba(232,200,74,0.2);
}

.tag.weekly {
background: rgba(232,122,58,0.1);
color: var(–accent2);
border-color: rgba(232,122,58,0.2);
}

/* ENTRY FORM */
.entry-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 4px;
padding: 24px;
margin-bottom: 20px;
}

.entry-card h2 {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 28px;
letter-spacing: 2px;
margin-bottom: 18px;
color: var(–text);
}

.form-row {
display: grid;
grid-template-columns: 1fr auto auto;
gap: 10px;
align-items: end;
}

@media (max-width: 520px) {
.form-row { grid-template-columns: 1fr 1fr; }
.form-row .btn-add { grid-column: 1 / -1; }
}

.field {
display: flex;
flex-direction: column;
gap: 6px;
}

.field label {
font-family: ‘DM Mono’, monospace;
font-size: 10px;
letter-spacing: 2px;
text-transform: uppercase;
color: var(–muted);
}

.field input {
background: var(–surface2);
border: 1px solid var(–border);
border-radius: 3px;
color: var(–text);
font-family: ‘DM Mono’, monospace;
font-size: 14px;
padding: 10px 14px;
outline: none;
transition: border-color 0.15s, box-shadow 0.15s;
width: 100%;
}

.field input:focus {
border-color: var(–accent);
box-shadow: 0 0 0 2px rgba(232,200,74,0.1);
}

.field input::placeholder { color: var(–muted); }

.field input[type=“number”] { width: 110px; }

.btn-add {
background: var(–accent);
color: var(–bg);
border: none;
border-radius: 3px;
font-family: ‘Bebas Neue’, sans-serif;
font-size: 18px;
letter-spacing: 2px;
padding: 11px 24px;
cursor: pointer;
transition: background 0.15s, transform 0.1s;
white-space: nowrap;
align-self: end;
}

.btn-add:hover { background: #f0d45e; }
.btn-add:active { transform: scale(0.97); }

/* REPORT TABLE */
.report-table {
width: 100%;
border-collapse: collapse;
}

.report-table th {
font-family: ‘DM Mono’, monospace;
font-size: 9px;
letter-spacing: 2px;
text-transform: uppercase;
color: var(–muted);
text-align: left;
padding: 10px 20px;
border-bottom: 1px solid var(–border);
}

.report-table th:last-child { text-align: right; }

.report-table td {
padding: 12px 20px;
font-family: ‘DM Mono’, monospace;
font-size: 13px;
border-bottom: 1px solid rgba(255,255,255,0.03);
vertical-align: middle;
}

.report-table td:last-child { text-align: right; }

.report-table tr:last-child td { border-bottom: none; }

.report-table tr:hover td { background: rgba(255,255,255,0.02); }

.supply-name {
color: var(–text);
font-weight: 500;
}

.supply-amount {
color: var(–accent);
font-size: 15px;
font-weight: 500;
}

.supply-amount.weekly { color: var(–accent2); }

.supply-time {
color: var(–muted);
font-size: 11px;
}

.empty-state {
padding: 36px 20px;
text-align: center;
font-family: ‘DM Mono’, monospace;
font-size: 11px;
color: var(–muted);
letter-spacing: 1px;
}

.empty-state .icon {
font-size: 28px;
margin-bottom: 10px;
opacity: 0.3;
}

/* SUMMARY BAR */
.summary-bar {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
gap: 12px;
margin-bottom: 20px;
}

.stat-box {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 4px;
padding: 18px 20px;
position: relative;
overflow: hidden;
}

.stat-box::after {
content: ‘’;
position: absolute;
bottom: 0; left: 0; right: 0;
height: 2px;
background: var(–accent);
}

.stat-box.weekly-stat::after { background: var(–accent2); }

.stat-label {
font-family: ‘DM Mono’, monospace;
font-size: 9px;
letter-spacing: 2px;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 8px;
}

.stat-value {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 38px;
letter-spacing: 1px;
color: var(–accent);
line-height: 1;
}

.stat-box.weekly-stat .stat-value { color: var(–accent2); }

.stat-sub {
font-family: ‘DM Mono’, monospace;
font-size: 10px;
color: var(–muted);
margin-top: 4px;
}

/* LOG SECTION */
.log-section {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 4px;
overflow: hidden;
margin-bottom: 20px;
}

.log-header {
padding: 16px 20px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: space-between;
flex-wrap: wrap;
gap: 10px;
}

.log-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 22px;
letter-spacing: 2px;
}

.btn-clear {
background: none;
border: 1px solid var(–danger);
color: var(–danger);
border-radius: 3px;
font-family: ‘DM Mono’, monospace;
font-size: 10px;
letter-spacing: 1px;
padding: 5px 12px;
cursor: pointer;
transition: all 0.15s;
text-transform: uppercase;
}

.btn-clear:hover {
background: var(–danger);
color: var(–bg);
}

/* DELETE ROW BUTTON */
.btn-del {
background: none;
border: none;
color: var(–muted);
cursor: pointer;
font-size: 14px;
padding: 2px 6px;
border-radius: 2px;
transition: color 0.15s, background 0.15px;
line-height: 1;
}

.btn-del:hover { color: var(–danger); background: rgba(232,90,90,0.1); }

/* WEEK NAVIGATION */
.week-nav {
display: flex;
align-items: center;
gap: 12px;
}

.btn-nav {
background: var(–surface2);
border: 1px solid var(–border);
color: var(–text);
border-radius: 3px;
font-size: 14px;
padding: 4px 10px;
cursor: pointer;
transition: border-color 0.15s;
}

.btn-nav:hover { border-color: var(–accent2); color: var(–accent2); }

.week-label {
font-family: ‘DM Mono’, monospace;
font-size: 11px;
color: var(–muted);
letter-spacing: 1px;
min-width: 140px;
text-align: center;
}

/* FLASH ANIMATION */
@keyframes flashRow {
0% { background: rgba(232,200,74,0.18); }
100% { background: transparent; }
}

.flash { animation: flashRow 0.8s ease-out; }

/* SCROLLABLE TABLE */
.table-scroll { overflow-x: auto; }

/* NOTIFICATION */
#toast {
position: fixed;
bottom: 28px;
right: 28px;
background: var(–success);
color: var(–bg);
font-family: ‘DM Mono’, monospace;
font-size: 12px;
letter-spacing: 1px;
padding: 10px 20px;
border-radius: 3px;
transform: translateY(80px);
opacity: 0;
transition: transform 0.3s, opacity 0.3s;
z-index: 999;
pointer-events: none;
}

#toast.show {
transform: translateY(0);
opacity: 1;
}
</style>

</head>

<script>
// ---------- STATE ----------
const STORAGE_KEY = 'supply_tracker_v2';
let entries = [];
let weekOffset = 0; // 0 = current week

function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  } catch { entries = []; }
}

function saveEntries() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

// ---------- DATE HELPERS ----------
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function getWeekBounds(offsetWeeks = 0) {
  const now = new Date();
  const day = now.getDay(); // 0=Sun
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((day + 6) % 7) + offsetWeeks * 7);
  monday.setHours(0,0,0,0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23,59,59,999);
  return { monday, sunday };
}

function formatDate(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function formatTime(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}

function formatShortDate(d) {
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

// ---------- ADD ENTRY ----------
function addEntry() {
  const nameEl = document.getElementById('supplyName');
  const amountEl = document.getElementById('supplyAmount');
  const unitEl = document.getElementById('supplyUnit');

  const name = nameEl.value.trim();
  const amount = parseFloat(amountEl.value);
  const unit = unitEl.value.trim();

  if (!name) { nameEl.focus(); shake(nameEl); return; }
  if (isNaN(amount) || amount <= 0) { amountEl.focus(); shake(amountEl); return; }

  const entry = {
    id: Date.now() + Math.random(),
    name,
    amount,
    unit,
    timestamp: new Date().toISOString(),
    date: todayStr()
  };

  entries.unshift(entry);
  saveEntries();

  nameEl.value = '';
  amountEl.value = '';
  unitEl.value = '';
  nameEl.focus();

  render();
  showToast(`✓ Logged ${amount} ${unit ? unit + ' of ' : ''}${name}`);
}

function shake(el) {
  el.style.borderColor = 'var(--danger)';
  setTimeout(() => el.style.borderColor = '', 800);
}

// ---------- DELETE ENTRY ----------
function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  saveEntries();
  render();
}

// ---------- CLEAR ALL ----------
function clearAllEntries() {
  if (!confirm('Clear ALL entries? This cannot be undone.')) return;
  entries = [];
  saveEntries();
  render();
}

// ---------- WEEK NAV ----------
function changeWeek(dir) {
  weekOffset += dir;
  if (weekOffset > 0) weekOffset = 0;
  render();
}

// ---------- AGGREGATE ----------
function aggregateEntries(list) {
  // Returns { supplyKey: { name, unit, total } }
  const map = {};
  for (const e of list) {
    const key = e.name.toLowerCase();
    if (!map[key]) map[key] = { name: e.name, unit: e.unit || '', total: 0 };
    map[key].total += e.amount;
    if (e.unit && !map[key].unit) map[key].unit = e.unit;
  }
  return Object.values(map).sort((a,b) => b.total - a.total);
}

// ---------- RENDER ----------
function render() {
  renderHeader();
  renderSummary();
  renderDaily();
  renderWeekly();
  renderLog();
}

function renderHeader() {
  const now = new Date();
  document.getElementById('dateDisplay').innerHTML =
    `<div>Today <span>${now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</span></div>
     <div>Week <span>${getISOWeek(now)}</span> of ${now.getFullYear()}</div>`;
}

function getISOWeek(d) {
  const tmp = new Date(d.valueOf());
  tmp.setHours(0,0,0,0);
  tmp.setDate(tmp.getDate() + 3 - (tmp.getDay()+6)%7);
  const week1 = new Date(tmp.getFullYear(), 0, 4);
  return 1 + Math.round(((tmp-week1)/86400000 - 3 + (week1.getDay()+6)%7)/7);
}

function renderSummary() {
  const today = todayStr();
  const { monday, sunday } = getWeekBounds(weekOffset);

  const todayEntries = entries.filter(e => e.date === today);
  const weekEntries = entries.filter(e => {
    const t = new Date(e.timestamp);
    return t >= monday && t <= sunday;
  });

  const dailyTypes = new Set(todayEntries.map(e => e.name.toLowerCase())).size;
  const weeklyTypes = new Set(weekEntries.map(e => e.name.toLowerCase())).size;
  const dailyTotal = todayEntries.reduce((s,e) => s + e.amount, 0);
  const weeklyTotal = weekEntries.reduce((s,e) => s + e.amount, 0);

  document.getElementById('summaryBar').innerHTML = `
    <div class="stat-box">
      <div class="stat-label">Today — Entries</div>
      <div class="stat-value">${todayEntries.length}</div>
      <div class="stat-sub">${dailyTypes} supply type${dailyTypes !== 1 ? 's' : ''}</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Today — Total Units</div>
      <div class="stat-value">${fmt(dailyTotal)}</div>
      <div class="stat-sub">across all supplies</div>
    </div>
    <div class="stat-box weekly-stat">
      <div class="stat-label">This Week — Entries</div>
      <div class="stat-value">${weekEntries.length}</div>
      <div class="stat-sub">${weeklyTypes} supply type${weeklyTypes !== 1 ? 's' : ''}</div>
    </div>
    <div class="stat-box weekly-stat">
      <div class="stat-label">This Week — Total Units</div>
      <div class="stat-value">${fmt(weeklyTotal)}</div>
      <div class="stat-sub">across all supplies</div>
    </div>
  `;
}

function fmt(n) {
  if (n >= 1000) return (n/1000).toFixed(1) + 'k';
  return Number.isInteger(n) ? n : n.toFixed(2).replace(/\.?0+$/,'');
}

function renderDaily() {
  const today = todayStr();
  const list = entries.filter(e => e.date === today);
  const agg = aggregateEntries(list);
  const tbody = document.getElementById('dailyBody');
  const empty = document.getElementById('dailyEmpty');

  if (!agg.length) {
    tbody.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = agg.map(r => `
    <tr>
      <td class="supply-name">${esc(r.name)}</td>
      <td class="supply-time">${esc(r.unit) || '—'}</td>
      <td class="supply-amount">${fmt(r.total)}</td>
    </tr>
  `).join('');
}

function renderWeekly() {
  const { monday, sunday } = getWeekBounds(weekOffset);
  const list = entries.filter(e => {
    const t = new Date(e.timestamp);
    return t >= monday && t <= sunday;
  });
  const agg = aggregateEntries(list);
  const tbody = document.getElementById('weeklyBody');
  const empty = document.getElementById('weeklyEmpty');
  const label = document.getElementById('weekLabel');

  label.textContent = `${formatShortDate(monday)} – ${formatShortDate(sunday)}`;

  if (!agg.length) {
    tbody.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = agg.map(r => `
    <tr>
      <td class="supply-name">${esc(r.name)}</td>
      <td class="supply-time">${esc(r.unit) || '—'}</td>
      <td class="supply-amount weekly">${fmt(r.total)}</td>
    </tr>
  `).join('');
}

function renderLog() {
  const tbody = document.getElementById('logBody');
  const empty = document.getElementById('logEmpty');

  if (!entries.length) {
    tbody.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = entries.map(e => `
    <tr id="row-${e.id}">
      <td class="supply-time">${formatDate(e.timestamp)}<br><span style="opacity:.6">${formatTime(e.timestamp)}</span></td>
      <td class="supply-name">${esc(e.name)}</td>
      <td class="supply-time">${esc(e.unit) || '—'}</td>
      <td class="supply-amount">${fmt(e.amount)}</td>
      <td><button class="btn-del" onclick="deleteEntry(${e.id})" title="Delete">✕</button></td>
    </tr>
  `).join('');
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- TOAST ----------
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ---------- KEYBOARD ----------
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'supplyName' || e.target.id === 'supplyAmount' || e.target.id === 'supplyUnit')) {
    addEntry();
  }
});

// ---------- INIT ----------
loadEntries();
render();
setInterval(() => {
  renderHeader();
  renderSummary();
  renderDaily();
}, 60000);
